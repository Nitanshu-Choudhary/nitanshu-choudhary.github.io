<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <a href="#hero" class="brand-logo" aria-label="Nitanshu Chaudhary - Home">
        <div class="logo-mark">
          <span class="mark-bracket">&lt;</span>
          <span class="mark-initials">NC</span>
          <span class="mark-slash">&#47;&gt;</span>
        </div>
        <div class="brand-name-wrap">
          <span class="brand-name">Nitanshu</span>
          <span class="brand-badge">.dev</span>
        </div>
      </a>
      <p class="footer-copy">
        © {{ currentYear }} {{ config.name }}. Software Developer.
      </p>
    </div>

    <div class="footer-right">
      <a [href]="config.resumeUrl" target="_blank" rel="noopener noreferrer" class="scroll-top-btn" style="margin-right: 0.8rem;">
        <span>Download Resume</span>
        <i class="fa-solid fa-download"></i>
      </a>
      <button (click)="scrollToTop()" class="scroll-top-btn" aria-label="Scroll to top">
        <span>Back to Top</span>
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </div>
</footer>
