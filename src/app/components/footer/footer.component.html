<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <a href="#hero" class="footer-logo">
        <span class="logo-icon">&lt;/&gt;</span>
        <span>{{ config.name }}<span class="dot">.</span></span>
      </a>
      <p class="footer-copy">
        © {{ currentYear }} {{ config.name }}. Software Developer.
      </p>
    </div>

    <div class="footer-right">
      <a [href]="config.resumeUrl" target="_blank" rel="noopener noreferrer" class="scroll-top-btn" style="margin-right: 0.8rem;">
        <span>Download Resume</span>
        <i class="fa-solid fa-download"></i>
      </a>
      <button (click)="scrollToTop()" class="scroll-top-btn" aria-label="Scroll to top">
        <span>Back to Top</span>
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </div>
</footer>
