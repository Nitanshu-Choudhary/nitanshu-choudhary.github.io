<header class="header" [class.scrolled]="isScrolled">
  <!-- Glowing Scroll Progress Bar -->
  <div class="scroll-progress-track">
    <div class="scroll-progress-fill" [style.width.%]="scrollProgress"></div>
  </div>

  <div class="container header-container">
    <a href="#hero" class="brand-logo" aria-label="Nitanshu Chaudhary - Home">
      <div class="logo-mark">
        <span class="mark-bracket">&lt;</span>
        <span class="mark-initials">NC</span>
        <span class="mark-slash">&#47;&gt;</span>
      </div>
      <div class="brand-name-wrap">
        <span class="brand-name">Nitanshu</span>
        <span class="brand-badge">.dev</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <ul class="nav-list">
        <li *ngFor="let link of navLinks">
          <a [href]="link.href" 
             class="nav-link"
             [class.active]="activeSection === link.id">
            {{ link.label }}
          </a>
        </li>
      </ul>
      <a href="#contact" class="btn btn-primary nav-cta">
        <span>Hire Me</span>
        <i class="fa-solid fa-paper-plane"></i>
      </a>
    </nav>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" [attr.aria-label]="'Toggle Menu'">
      <i [class]="isMobileMenuOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i>
    </button>
  </div>

  <!-- Mobile Drawer Navigation -->
  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <ul class="mobile-nav-list">
      <li *ngFor="let link of navLinks">
        <a [href]="link.href" 
           class="mobile-nav-link"
           [class.active]="activeSection === link.id" 
           (click)="closeMobileMenu()">
          {{ link.label }}
        </a>
      </li>
    </ul>
    <a href="#contact" class="btn btn-primary mobile-cta" (click)="closeMobileMenu()">
      <span>Hire Me</span>
      <i class="fa-solid fa-paper-plane"></i>
    </a>
  </div>
</header>
